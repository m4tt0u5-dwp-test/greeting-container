name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.actor }}/greeting-container
  IMAGE_TAG: "v1"

jobs:

  # stage 1 lint dockerfile
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  # stage 2 security scan
  security_scan:
    name: Security Scan
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build an image from Dockerfile
        run: docker build -t mattous/greeting-container:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'mattous/greeting-container:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  smoke_test:
    name: Container Smoke Test
    needs: security_scan
    runs-on: ubuntu-24.04
    run: |
      docker run -d --name test-app -p 8080:8080 mattous/greeting-container:${{ github.sha }}
      sleep 3
      # Verify health endpoint returns HTTP 200
      curl --fail http://localhost:8080/healthz || exit 1
      
      # Verify info endpoint
      curl --fail http://localhost:8080/info || exit 1
      
      # Verify non-root execution
      USER_ID=$(docker exec test-app id -u)
      
      if [ "$USER_ID" -eq 0 ]; then
        echo "Error: Container running as root!"
        exit 1
      fi
      
      docker stop test-app  

  # stage 3 build and push
  publish:
    name: Publish image to GHCR
    needs: smoke_test
    runs-on: ubuntu-24.04

    # only publish when merging into main
    # if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}