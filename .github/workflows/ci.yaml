name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.actor }}/greeting-container
  IMAGE_TAG: "v1" 

jobs:

  lint:
    name: Dockerfile Lint and Gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run Dockerlint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  security_scan:
    name: Security Scan & Smoke Test
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build an image from Dockerfile
        run: docker build -t m4tt0u5-dwp-test/greeting-container:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'm4tt0u5-dwp-test/greeting-container:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Smoke Test
        run: |
          docker run -d --name test-app -p 8080:8080 m4tt0u5-dwp-test/greeting-container:${{ github.sha }}
          sleep 3
          check_endpoint() {
            local path="$1"
            echo "Testing endpoint http://localhost:8080$path"
            if ! curl --fail --silent --show-error "http://localhost:8080$path" > /dev/null; then
              echo "::error title=Smoke Test Failed::Smoke test failed for endpoint $path"
              echo "--- Container Logs ---"
              docker logs test-app
              exit 1
            fi
          }
          check_endpoint "/healthz"
          check_endpoint "/info"
          check_endpoint "/"
          # Verify non-root execution
          USER_ID=$(docker exec test-app id -u)
          if [ "$USER_ID" -eq 0 ]; then
            echo "Error: Container running as root!"
            exit 1
          fi
          docker stop test-app

  publish:
    name: Build & Publish image to GHCR
    needs: security_scan
    runs-on: ubuntu-24.04

    # only publish when merging into main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          annotations: |
            index:org.opencontainers.image.title=greeting-container
            index:org.opencontainers.image.description=Production-grade container for the DWP DevOps assessment
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=MIT
